services:
  - type: web
    name: himchistka-crm
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_PASSWORD
        value: "1234"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: himchistka-data
      mountPath: /var/data
      sizeGB: 1
